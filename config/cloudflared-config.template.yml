# Cloudflare Tunnel Configuration Template
#
# For user config: Copy to C:\Users\<username>\.cloudflared\config.yml
# For service config: Copy to C:\Program Files (x86)\cloudflared\config.yml
#
# Replace placeholders: <TUNNEL-UUID>, <username>
#
# UPDATED: 2025-12-27 - Traefik Integration (PRD-008)
# Domain: selfwize.com
# Tunnel ID: 1f014ff9-68ae-4033-bacf-e058b91d2df4

tunnel: <TUNNEL-UUID>

# For user config:
# credentials-file: C:\Users\<username>\.cloudflared\<TUNNEL-UUID>.json
# For service config:
credentials-file: C:\Program Files (x86)\cloudflared\<TUNNEL-UUID>.json

# ============================================================================
# TRAEFIK INTEGRATION (PRD-008)
# ============================================================================
# All *.selfwize.com traffic is routed to Traefik reverse proxy.
# Traefik handles routing based on Host header and Docker labels.
#
# To add a new service:
#   1. Add traefik.enable=true label to your docker-compose
#   2. Add traefik.http.routers.<name>.rule=Host(`<name>.selfwize.com`) label
#   3. No changes needed here - wildcard catches all subdomains!
#
# For services not in Docker, add to traefik/dynamic/external-services.yml

ingress:
  # Wildcard rule - all *.selfwize.com traffic goes to Traefik
  - hostname: "*.selfwize.com"
    service: http://localhost:80

  # Catch-all rule (required, must be last)
  - service: http_status:404

