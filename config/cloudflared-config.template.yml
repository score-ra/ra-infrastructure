# Cloudflare Tunnel Configuration Template
#
# For user config: Copy to C:\Users\<username>\.cloudflared\config.yml
# For service config: Copy to C:\Program Files (x86)\cloudflared\config.yml
#
# Replace placeholders: <TUNNEL-UUID>
# Domain: selfwize.com
# Tunnel ID: 1f014ff9-68ae-4033-bacf-e058b91d2df4

tunnel: <TUNNEL-UUID>

# For user config:
# credentials-file: C:\Users\<username>\.cloudflared\<TUNNEL-UUID>.json
# For service config:
credentials-file: C:\Program Files (x86)\cloudflared\<TUNNEL-UUID>.json

# Ingress rules (order matters - first match wins)
ingress:
  # IT/Asset Inventory (Snipe-IT, etc.)
  - hostname: stuff.selfwize.com
    service: http://localhost:3001
    originRequest:
      noTLSVerify: true

  # Medical/Health Records (Fasten Health, etc.)
  - hostname: wellness.selfwize.com
    service: http://localhost:3002
    originRequest:
      noTLSVerify: true

  # Main Dashboard (future)
  - hostname: app.selfwize.com
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true

  # API Endpoint (future)
  - hostname: api.selfwize.com
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true

  # Catch-all rule (required, must be last)
  - service: http_status:404

# Advanced options (uncomment if needed)
#
# loglevel: info
#
# originRequest:
#   connectTimeout: 30s
#   tlsTimeout: 10s
#   tcpKeepAlive: 30s
#   keepAliveConnections: 100
#   keepAliveTimeout: 90s
