# Cloudflare Tunnel Configuration Template
#
# For user config: Copy to C:\Users\<username>\.cloudflared\config.yml
# For service config: Copy to C:\Program Files (x86)\cloudflared\config.yml
#
# Replace placeholders: <TUNNEL-UUID>, <username>
#
# VERIFIED WORKING CONFIG (2025-12-20)
# Domain: selfwize.com
# Tunnel ID: 1f014ff9-68ae-4033-bacf-e058b91d2df4

tunnel: <TUNNEL-UUID>

# For user config:
# credentials-file: C:\Users\<username>\.cloudflared\<TUNNEL-UUID>.json
# For service config:
credentials-file: C:\Program Files (x86)\cloudflared\<TUNNEL-UUID>.json

# Ingress rules (order matters - first match wins)
#
# IMPORTANT LESSONS:
# 1. Match ports to ACTUAL Docker port mappings (run: docker ps)
# 2. Use https:// for services that require HTTPS (like Fasten Health)
# 3. Only add noTLSVerify for HTTPS services with self-signed certs
# 4. Don't add noTLSVerify for HTTP services - it's unnecessary

ingress:
  # Snipe-IT Asset Inventory
  # Docker: 0.0.0.0:8082->80/tcp (use port 8082)
  # Protocol: HTTP (container serves HTTP on port 80)
  - hostname: stuff.selfwize.com
    service: http://localhost:8082

  # Fasten Health Records
  # Docker: 0.0.0.0:9090->8080/tcp (use port 9090)
  # Protocol: HTTPS with self-signed cert (requires noTLSVerify)
  - hostname: wellness.selfwize.com
    service: https://localhost:9090
    originRequest:
      noTLSVerify: true

  # Gatus Service Status Dashboard
  # Docker: 0.0.0.0:8083->8080/tcp (use port 8083)
  # Protocol: HTTP
  - hostname: dash.selfwize.com
    service: http://localhost:8083

  # Main Dashboard (future)
  - hostname: app.selfwize.com
    service: http://localhost:3000

  # API Endpoint (future)
  - hostname: api.selfwize.com
    service: http://localhost:8080

  # Catch-all rule (required, must be last)
  - service: http_status:404

# Notes:
# - 502 error = service not running on that port
# - 524 error = wrong port OR service accepts connection but doesn't respond to HTTP
# - "HTTP to HTTPS server" error = use https:// instead of http://
# - App redirects to internal IP = update APP_URL in app's .env file
