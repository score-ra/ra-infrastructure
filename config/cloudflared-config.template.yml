# ============================================================================
# TROUBLESHOOTING
# ============================================================================
# - 502 error = Traefik not running OR service not found by Traefik
# - 404 error = No matching route in Traefik
# - Check Traefik dashboard: http://localhost:8080
# - Check cloudflared logs: cloudflared.exe tunnel --config config.yml run
