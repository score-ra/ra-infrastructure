# Traefik Static Configuration
# ra-infrastructure Reverse Proxy
#
# Traffic flow: Cloudflare -> Tunnel -> Traefik:80 -> Services
# SSL: Terminated at Cloudflare edge (Traefik receives plain HTTP)

# API and Dashboard
api:
  dashboard: true
  insecure: true  # Dashboard on :8080, internal only (not exposed via tunnel)

# Entry Points
entryPoints:
  web:
    address: ":80"
    # Trust Cloudflare proxy headers
    forwardedHeaders:
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"

# Providers
providers:
  # Docker provider - auto-discover containers with labels
  docker:
    endpoint: "npipe:////./pipe/docker_engine"  # Windows named pipe
    exposedByDefault: false  # Only containers with traefik.enable=true
    network: inventory_network
    watch: true

  # File provider - for external services (non-Docker apps)
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

# Logging
log:
  level: INFO
  format: common

accessLog:
  format: common
