# External Services Configuration (non-Docker apps)
#
# These services run outside this docker-compose but need routing via Traefik.
# Traefik connects to them via host.docker.internal (Docker Desktop on Windows)
#
# To add a new external service:
#   1. Add a router with Host rule
#   2. Add a service with loadBalancer pointing to host.docker.internal:port
#   3. For HTTPS with self-signed certs, add serversTransport with insecureSkipVerify

http:
  routers:
    # Selfwize Dashboard (static, config-driven)
    dashboard-router:
      rule: "Host(`dash.selfwize.com`)"
      entryPoints:
        - web
      service: dashboard-service
      middlewares:
        - cloudflare-headers

    # Gatus Monitoring
    gatus-router:
      rule: "Host(`status.selfwize.com`)"
      entryPoints:
        - web
      service: gatus-service
      middlewares:
        - cloudflare-headers

    # Snipe-IT Asset Inventory
    snipeit-router:
      rule: "Host(`stuff.selfwize.com`)"
      entryPoints:
        - web
      service: snipeit-service
      middlewares:
        - cloudflare-headers

    # Fasten Health Records
    fasten-router:
      rule: "Host(`wellness.selfwize.com`)"
      entryPoints:
        - web
      service: fasten-service
      middlewares:
        - cloudflare-headers

    # Homeseer Home Automation
    homeseer-router:
      rule: "Host(`home.selfwize.com`)"
      entryPoints:
        - web
      service: homeseer-service
      middlewares:
        - cloudflare-headers

    # Blue Iris Security Cameras
    blueiris-router:
      rule: "Host(`cameras.selfwize.com`)"
      entryPoints:
        - web
      service: blueiris-service
      middlewares:
        - cloudflare-headers

    # Family Contacts (Gramps Web) - ra-life-tracker
    family-router:
      rule: "Host(`family.selfwize.com`)"
      entryPoints:
        - web
      service: family-service
      middlewares:
        - cloudflare-headers

    # Daily Event Log - ra-life-tracker
    events-router:
      rule: "Host(`events.selfwize.com`)"
      entryPoints:
        - web
      service: events-service
      middlewares:
        - cloudflare-headers

  services:
    # Selfwize Dashboard (Docker container on port 8088)
    dashboard-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8088"

    # Gatus (Docker container on port 8083)
    gatus-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8083"
    # Snipe-IT (HTTP on port 8082)
    snipeit-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"

    # Fasten Health (HTTP on port 9090)
    fasten-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:9090"

    # Homeseer (HTTP on 192.168.68.56:80)
    homeseer-service:
      loadBalancer:
        servers:
          - url: "http://192.168.68.56:80"

    # Blue Iris (HTTPS on 192.168.68.56:443 with self-signed cert)
    blueiris-service:
      loadBalancer:
        servers:
          - url: "https://192.168.68.56:443"
        serversTransport: selfsigned-transport

    # Family Contacts / Gramps Web (HTTP on port 5000)
    family-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5000"

    # Daily Event Log (HTTP on port 8000)
    events-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"

  serversTransports:
    # Transport for services with self-signed certificates
    selfsigned-transport:
      insecureSkipVerify: true

  middlewares:
    # Pass correct headers to backend services
    cloudflare-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
