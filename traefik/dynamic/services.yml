# Traefik Dynamic Configuration - selfwize.com routes
#
# All *.selfwize.com routes consolidated here. Docker containers use internal
# DNS names on ra_network; external services use LAN IPs or host.docker.internal.

http:
  routers:
    # Snipe-IT Asset Management
    stuff-selfwize-router:
      rule: "Host(`stuff.selfwize.com`)"
      entryPoints:
        - web
      service: stuff-selfwize-service
      middlewares:
        - cloudflare-headers

    # Fasten Health - Personal Health Records
    wellness-selfwize-router:
      rule: "Host(`wellness.selfwize.com`)"
      entryPoints:
        - web
      service: wellness-selfwize-service
      middlewares:
        - cloudflare-headers

    # Gatus Status Page
    status-selfwize-router:
      rule: "Host(`status.selfwize.com`)"
      entryPoints:
        - web
      service: status-selfwize-service
      middlewares:
        - cloudflare-headers

    # Selfwize Dashboard - Service Directory
    dash-selfwize-router:
      rule: "Host(`dash.selfwize.com`)"
      entryPoints:
        - web
      service: dash-selfwize-service
      middlewares:
        - cloudflare-headers

    # Daily Event Log - Personal Event Tracking
    events-selfwize-router:
      rule: "Host(`events.selfwize.com`)"
      entryPoints:
        - web
      service: events-selfwize-service
      middlewares:
        - cloudflare-headers

    # Label Service - QR Label Management
    labels-selfwize-router:
      rule: "Host(`labels.selfwize.com`)"
      entryPoints:
        - web
      service: labels-selfwize-service
      middlewares:
        - cloudflare-headers

    # Family Contacts (Gramps Web) - ra-life-tracker
    family-selfwize-router:
      rule: "Host(`family.selfwize.com`)"
      entryPoints:
        - web
      service: family-selfwize-service
      middlewares:
        - cloudflare-headers

  services:
    # Snipe-IT: Docker container on ra_network
    stuff-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://ra_snipeit:80"

    # Fasten Health: Docker container on ra_network
    wellness-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://ra_fasten:8080"

    # Gatus: Docker container on ra_network
    status-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://ra_gatus:8080"

    # Dashboard: Docker container on ra_network
    dash-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://ra_dashboard:80"

    # Daily Event Log: Docker container on ra_network
    events-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://ra_eventlog:8000"

    # Label Service: Docker container on ra_network
    labels-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://ra_labels:8000"

    # Family Contacts / Gramps Web: host-external
    family-selfwize-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5000"

  middlewares:
    # Cloudflare terminates TLS; tell backends the original protocol was HTTPS
    cloudflare-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
