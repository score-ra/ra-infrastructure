# Homarr Dashboard for ra-infrastructure (v1.0+)
# PRD: docs/prds/PRD-008-reverse-proxy-infrastructure.md
# Migration: https://homarr.dev/blog/2025/01/19/migration-guide-1.0/
#
# Prerequisites:
#   1. Docker Desktop running
#   2. inventory_network exists
#   3. Traefik running
#   4. Copy .env.template to .env and set SECRET_ENCRYPTION_KEY
#
# Quick Start:
#   cd homarr && docker-compose -f docker-compose.homarr.yml up -d
#
# Access: https://dash.selfwize.com (via Cloudflare Tunnel + Traefik)
# Local:  http://localhost:7575 (direct access, bypasses Traefik)

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "7575:3000"  # Homarr 1.0 uses port 3000 internally
    volumes:
      - homarr-appdata:/appdata
      # Docker socket for optional Docker integration (container status)
      - //./pipe/docker_engine://var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
    networks:
      - inventory_network
    labels:
      # Traefik routing (not used on Windows, see traefik/dynamic/external-services.yml)
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.rule=Host(`dash.selfwize.com`)"
      - "traefik.http.routers.homarr.entrypoints=web"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  homarr-appdata:
    name: homarr_appdata

networks:
  inventory_network:
    external: true
