# DEPRECATED: Use root docker-compose.yml instead (service: ra_gatus)
# This standalone file is kept for reference only.
#
# Gatus Service Status Monitoring for ra-infrastructure
# PRD: docs/prds/PRD-007-service-monitoring-dashboard.md
#
# Quick Start:
#   1. Ensure main infrastructure is running: cd docker && docker-compose up -d
#   2. Copy .env.template to .env and configure SMTP
#   3. Start Gatus: docker-compose -f docker-compose.gatus.yml up -d
#   4. Access dashboard: https://status.selfwize.com (via Traefik)
#      Or locally: http://localhost:8083

services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: ra-status
    restart: unless-stopped
    ports:
      - "8083:8080"  # Direct access (kept for local testing)
    volumes:
      - ./config/gatus.yaml:/config/config.yaml:ro
      - gatus-data:/data
    env_file:
      - .env
    networks:
      - inventory_network
    labels:
      # Traefik routing (PRD-008)
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`status.selfwize.com`)"
      - "traefik.http.routers.gatus.entrypoints=web"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  gatus-data:
    name: ra_gatus_data

networks:
  inventory_network:
    external: true
