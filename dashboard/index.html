<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Selfwize</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <span class="header-logo">🦞</span>
            <h1 class="header-title">Selfwize</h1>
        </div>
        <div class="header-status" id="connection-status">
            <span class="status-dot status-dot--online"></span>
            <span class="status-text">Online</span>
        </div>
    </header>

    <main class="main" id="services-container">
        <!-- Services loaded dynamically from services.json -->
    </main>

    <footer class="footer">
        <span class="footer-text">Last updated: <span id="last-updated">--</span></span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
