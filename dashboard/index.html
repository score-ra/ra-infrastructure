<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwize Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: #f8fafc;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border-color: #475569;
        }
        .card .icon { font-size: 2rem; margin-bottom: 0.75rem; }
        .card .name { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.25rem; }
        .card .desc { font-size: 0.9rem; color: #94a3b8; }
        .status {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            color: #475569;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>Selfwize Services</h1>
    <div class="grid" id="services"></div>
    <footer>selfwize.com &mdash; ra-infrastructure</footer>
    <script src="app.js"></script>
</body>
</html>
