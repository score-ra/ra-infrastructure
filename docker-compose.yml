# ra-infrastructure - selfwize.com services
# Standalone stack for personal/home services, independent from sc-infrastructure
#
# Services:
#   - PostgreSQL 16 (inventory database)
#   - MySQL 8.0 (Snipe-IT)
#   - Snipe-IT (asset management)
#   - Fasten Health (personal health records)
#   - Selfwize Dashboard (service directory)
#   - Daily Event Log (personal event tracking)
#   - PostgreSQL 16 (event_log database)
#   - Traefik (reverse proxy, host port 8070)
#   - Gatus (monitoring)
#   - pgAdmin 4 (database management)
#
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f

networks:
  ra_network:
    driver: bridge

volumes:
  ra_postgres_data:
  ra_mysql_data:
  ra_snipeit_data:
  ra_snipeit_logs:
  ra_fasten_db:
  ra_fasten_cache:
  ra_fasten_certs:
  ra_gatus_data:
  ra_pgadmin_data:
  ra_eventlog_postgres_data:

services:
  # ==========================================================================
  # DATABASES
  # ==========================================================================

  ra_postgres:
    image: postgres:16-alpine
    container_name: ra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"
    volumes:
      - ra_postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/init:/docker-entrypoint-initdb.d
    networks:
      - ra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  ra_mysql:
    image: mysql:8.0
    container_name: ra_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: snipeit
      MYSQL_USER: ${SNIPEIT_DB_USER:-snipeit}
      MYSQL_PASSWORD: ${SNIPEIT_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - ra_mysql_data:/var/lib/mysql
    networks:
      - ra_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  ra_eventlog_db:
    image: postgres:16-alpine
    container_name: ra_eventlog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventlog
      POSTGRES_PASSWORD: ${EVENTLOG_DB_PASSWORD:-eventlog_secret}
      POSTGRES_DB: event_log
    ports:
      - "5434:5432"
    volumes:
      - ra_eventlog_postgres_data:/var/lib/postgresql/data
    networks:
      - ra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlog -d event_log"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================================================
  # APPLICATIONS
  # ==========================================================================

  ra_snipeit:
    image: snipe/snipe-it:latest
    container_name: ra_snipeit
    restart: unless-stopped
    depends_on:
      ra_mysql:
        condition: service_healthy
    env_file:
      - ../snipeit-asset-management/.env
    ports:
      - "8083:80"
    volumes:
      - ra_snipeit_data:/var/lib/snipeit
      - ra_snipeit_logs:/var/www/html/storage/logs
    networks:
      - ra_network
    deploy:
      resources:
        limits:
          memory: 512M

  ra_fasten:
    image: ghcr.io/fastenhealth/fasten-onprem:main
    container_name: ra_fasten
    restart: unless-stopped
    ports:
      - "9091:8080"
    volumes:
      - ra_fasten_db:/opt/fasten/db
      - ra_fasten_cache:/opt/fasten/cache
      - ra_fasten_certs:/opt/fasten/certs/shared
      - ./fasten/config.yaml:/opt/fasten/config/config.yaml:ro
    networks:
      - ra_network
    deploy:
      resources:
        limits:
          memory: 256M

  ra_eventlog:
    image: daily-event-log:latest
    container_name: ra_eventlog
    restart: unless-stopped
    depends_on:
      ra_eventlog_db:
        condition: service_healthy
    env_file:
      - ../ra-life-tracker/.env
    ports:
      - "8089:8000"
    networks:
      - ra_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  ra_dashboard:
    image: nginx:alpine
    container_name: ra_dashboard
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - ra_network
    deploy:
      resources:
        limits:
          memory: 32M

  # ==========================================================================
  # INFRASTRUCTURE
  # ==========================================================================

  ra_traefik:
    image: traefik:v3.2
    container_name: ra_traefik
    restart: unless-stopped
    ports:
      - "8070:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - ra_network
    deploy:
      resources:
        limits:
          memory: 128M

  ra_gatus:
    image: twinproduction/gatus:latest
    container_name: ra_gatus
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./gatus/config:/config:ro
      - ra_gatus_data:/data
    networks:
      - ra_network
    deploy:
      resources:
        limits:
          memory: 128M

  ra_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ra_pgadmin
    restart: unless-stopped
    depends_on:
      ra_postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8084:80"
    volumes:
      - ra_pgadmin_data:/var/lib/pgadmin
    networks:
      - ra_network
    deploy:
      resources:
        limits:
          memory: 256M
